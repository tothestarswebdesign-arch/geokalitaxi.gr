<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Geokali Taxi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0e14;--bg2:#121722;--card:#171d2b;--line:#2a3247;--tx:#eef0f5;--mu:#9aa3b8;--gold:#d9b26a;--gold2:#f1d59a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.65 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
h1,h2,h3{font-family:'Playfair Display',Georgia,'Times New Roman',serif;line-height:1.15}
a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(11,14,20,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px;gap:14px}
.logo{font-family:'Playfair Display',Georgia,serif;font-size:22px;font-weight:700;letter-spacing:.5px}
.logo b{color:var(--gold)}
nav{display:flex;gap:22px;font-size:14px;color:var(--mu)}
nav a:hover{color:var(--gold)}
.tools{display:flex;gap:10px;align-items:center}
.lang{border:1px solid var(--line);background:none;color:var(--tx);border-radius:8px;padding:7px 11px;font:600 13px Inter,sans-serif;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1407;font-weight:600;padding:13px 24px;border-radius:999px;border:0;cursor:pointer;font-size:15px;font-family:inherit;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(217,178,106,.3)}
.btn.o{background:none;color:var(--tx);border:1px solid var(--line)}
.btn.o:hover{border-color:var(--gold);box-shadow:none}
.hero{position:relative;padding:110px 0 100px;overflow:hidden;background:radial-gradient(900px 500px at 78% 10%,rgba(217,178,106,.16),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(70,90,160,.18),transparent 60%)}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:38px;height:6px;background:repeating-linear-gradient(90deg,var(--gold) 0 28px,transparent 28px 56px);opacity:.35}
.tag{display:inline-block;color:var(--gold);border:1px solid rgba(217,178,106,.4);border-radius:999px;padding:5px 14px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:22px}
.hero h1{font-size:clamp(38px,6.5vw,72px);max-width:800px}
.hero h1 em{color:var(--gold);font-style:italic}
.hero p{color:var(--mu);max-width:560px;margin:22px 0 34px;font-size:18px}
.cta{display:flex;gap:14px;flex-wrap:wrap}
section{padding:88px 0}
.alt{background:var(--bg2)}
.eyebrow{color:var(--gold);font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:10px}
h2{font-size:clamp(28px,4vw,42px);margin-bottom:14px}
.sub{color:var(--mu);max-width:600px;margin-bottom:44px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;transition:transform .25s,border-color .25s}
.card:hover{transform:translateY(-5px);border-color:var(--gold)}
.ic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;background:rgba(217,178,106,.12);color:var(--gold);margin-bottom:18px}
.ic svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.card h3{font-size:21px;margin-bottom:8px}
.card p{color:var(--mu);font-size:15px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:20px;text-align:center}
.stats b{display:block;font:700 40px 'Playfair Display',Georgia,serif;color:var(--gold)}
.stats span{color:var(--mu);font-size:14px}
.two{display:grid;grid-template-columns:1fr 1.1fr;gap:48px;align-items:start}
form{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px;display:grid;gap:14px}
label{font-size:13px;color:var(--mu);display:grid;gap:6px}
input,select,textarea{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.info{display:grid;gap:18px;margin-top:26px}
.info a,.info div{display:flex;gap:14px;align-items:center;color:var(--tx)}
.info .ic{margin:0;flex:none}
.info small{display:block;color:var(--mu)}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--mu);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
.float{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:9;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold));display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.float svg{width:26px;height:26px;stroke:#1a1407;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:860px){nav{display:none}.two{grid-template-columns:1fr}.hero{padding:70px 0 80px}section{padding:64px 0}.r2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap nav">
<a href="#top" class="logo">Geokali <b>Taxi</b></a>
<nav><a href="#services" data-i="n1"></a><a href="#why" data-i="n2"></a><a href="#contact" data-i="n3"></a></nav>
<div class="tools"><button class="lang" id="lang" aria-label="Language">EN</button><a class="btn" id="callTop" href="#"><span data-i="call"></span></a></div>
</div></header>

<main id="top">
<div class="hero"><div class="wrap">
<span class="tag" data-i="tag"></span>
<h1 data-i="h1"></h1>
<p data-i="lead"></p>
<div class="cta"><a class="btn" href="#contact" data-i="book"></a><a class="btn o" href="#services" data-i="ours"></a></div>
</div></div>

<section id="services"><div class="wrap">
<div class="eyebrow" data-i="n1"></div><h2 data-i="sh"></h2><p class="sub" data-i="ss"></p>
<div class="grid">
<div class="card"><div class="ic"><svg viewBox="0 0 24 24"><path d="M3 13l2-6a2 2 0 012-1h10a2 2 0 012 1l2 6v5h-2v-2H5v2H3z"/><circle cx="7.5" cy="14" r="1"/><circle cx="16.5" cy="14" r="1"/><path d="M10 4h4"/></svg></div><h3 data-i="s1t"></h3><p data-i="s1d"></p></div>
<div class="card"><div class="ic"><svg viewBox="0 0 24 24"><path d="M7 7h13l-3-3M17 17H4l3 3"/></svg></div><h3 data-i="s2t"></h3><p data-i="s2d"></p></div>
<div class="card"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg></div><h3 data-i="s3t"></h3><p data-i="s3d"></p></div>
<div class="card"><div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.6-1.5 1.7-2 3-2s2.4.5 3 2M14 10h4M14 13h3"/></svg></div><h3 data-i="s4t"></h3><p data-i="s4d"></p></div>
</div></div></section>

<section class="alt" id="why"><div class="wrap">
<div class="eyebrow" data-i="n2"></div><h2 data-i="wh"></h2><p class="sub" data-i="ws"></p>
<div class="stats">
<div><b>24/7</b><span data-i="st1"></span></div>
<div><b>100%</b><span data-i="st2"></span></div>
<div><b>1</b><span data-i="st3"></span></div>
<div><b>0€</b><span data-i="st4"></span></div>
</div></div></section>

<section id="contact"><div class="wrap two">
<div>
<div class="eyebrow" data-i="n3"></div><h2 data-i="ch"></h2><p class="sub" data-i="cs" style="margin-bottom:0"></p>
<div class="info">
<a id="phoneL" href="#"><span class="ic"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg></span><span><b id="phoneT"></b><small data-i="phs"></small></span></a>
<a id="mailL" href="#"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span><span><b id="mailT"></b><small data-i="ems"></small></span></a>
<a href="https://www.facebook.com/geokali.taxi/" target="_blank" rel="noopener"><span class="ic"><svg viewBox="0 0 24 24"><path d="M14 8h3V4h-3a4 4 0 00-4 4v3H7v4h3v6h4v-6h3l1-4h-4V8z"/></svg></span><span><b>Facebook</b><small>geokali.taxi</small></span></a>
</div></div>
<form id="f">
<label><span data-i="fs"></span><select id="svc"><option data-i="s1t"></option><option data-i="s2t"></option><option data-i="s3t"></option><option data-i="s4t"></option></select></label>
<div class="r2"><label><span data-i="fn"></span><input id="nm" required></label><label><span data-i="fp"></span><input id="ph" type="tel" required></label></div>
<div class="r2"><label><span data-i="fd"></span><input id="dt" type="date"></label><label><span data-i="ft"></span><input id="tm" type="time"></label></div>
<label><span data-i="fm"></span><textarea id="ms" rows="3"></textarea></label>
<div class="acts"><button class="btn" type="submit" id="sb" data-i="send"></button><button class="btn o" type="button" id="wab" data-i="wa"></button></div>
<p id="st" role="status" style="color:var(--gold);font-size:14px"></p>
</form>
</div></section>
</main>

<footer><div class="wrap"><span>© <span id="yr"></span> Geokali Taxi</span><span data-i="foot"></span></div></footer>
<a class="float" id="callF" href="#" aria-label="Call"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg></a>

<script>
/* ====== EDIT THESE ====== */
const CFG={phone:"+306996233496",phoneShow:"699 623 3496",email:"geokalidiekperaioseis@gmail.com"};
/* ======================== */
const T={el:{n1:"Υπηρεσίες",n2:"Γιατί εμάς",n3:"Επικοινωνία",call:"Κλήση",tag:"Ταξί · Ασφάλειες · Διεκπεραιώσεις",
h1:"Η μετακίνησή σας, με <em>στυλ</em> και ασφάλεια.",lead:"Αξιόπιστο ταξί όλο το 24ωρο και ολοκληρωμένες υπηρεσίες για επαγγελματίες οδηγούς και ιδιοκτήτες οχημάτων.",
book:"Κλείστε τώρα",ours:"Οι υπηρεσίες μας",sh:"Όλα όσα χρειάζεστε, σε ένα σημείο",ss:"Από την καθημερινή διαδρομή μέχρι την αγοραπωλησία ταξί και τα χαρτιά σας.",
s1t:"Υπηρεσίες Ταξί",s1d:"Μεταφορές από και προς αεροδρόμιο, λιμάνι και κάθε προορισμό, με επαγγελματίες οδηγούς.",
s2t:"Αγορές · Πωλήσεις · Ενοικιάσεις · Ανταλλαγές Ταξί",s2d:"Αγοράζουμε, πουλάμε, ενοικιάζουμε και ανταλλάσσουμε ταξί με διαφάνεια και σωστή καθοδήγηση.",
s3t:"Ασφάλειες Αυτοκινήτων",s3d:"Ασφαλιστική κάλυψη για ταξί και ιδιωτικά οχήματα, με προσφορές στα μέτρα σας.",
s4t:"Διεκπεραιώσεις Διπλωμάτων",s4d:"Αναλαμβάνουμε τα χαρτιά και τις διαδικασίες για διπλώματα, γρήγορα και χωρίς ταλαιπωρία.",
wh:"Εμπιστοσύνη που φαίνεται στη διαδρομή",ws:"Σοβαρότητα, συνέπεια και προσωπική εξυπηρέτηση σε κάθε υπηρεσία.",
st1:"Διαθεσιμότητα",st2:"Συνέπεια",st3:"Ένα σημείο επαφής",st4:"Κρυφές χρεώσεις",
ch:"Ζητήστε την προσφορά σας",cs:"Συμπληρώστε τη φόρμα και θα επικοινωνήσουμε άμεσα μαζί σας.",phs:"Καλέστε μας οποιαδήποτε ώρα",ems:"Γράψτε μας",
fs:"Υπηρεσία",fn:"Ονοματεπώνυμο",fp:"Τηλέφωνο",fd:"Ημερομηνία",ft:"Ώρα",fm:"Μήνυμα / λεπτομέρειες",wa:"Viber",vb:"Το μήνυμα αντιγράφηκε. Επικολλήστε το στη συνομιλία Viber που άνοιξε.",send:"Αποστολή αίτησης",ok:"Ευχαριστούμε! Η αίτησή σας εστάλη και θα επικοινωνήσουμε σύντομα.",fb:"Άνοιξε η εφαρμογή email σας. Πατήστε «Αποστολή» για να φτάσει η αίτηση σε εμάς.",foot:"Ταξί · Ασφάλειες · Διεκπεραιώσεις"},
en:{n1:"Services",n2:"Why us",n3:"Contact",call:"Call",tag:"Taxi · Insurance · Paperwork",
h1:"Your journey, with <em>style</em> and safety.",lead:"Reliable taxi service around the clock, plus complete services for professional drivers and vehicle owners.",
book:"Book now",ours:"Our services",sh:"Everything you need in one place",ss:"From your daily ride to buying and selling a taxi, and all the paperwork.",
s1t:"Taxi Services",s1d:"Transfers to and from the airport, port and any destination, with professional drivers.",
s2t:"Taxi Purchase · Sale · Rental · Exchange",s2d:"We buy, sell, rent and exchange taxis with transparency and proper guidance.",
s3t:"Vehicle Insurance",s3d:"Coverage for taxis and private vehicles, with quotes tailored to you.",
s4t:"Driving License Processing",s4d:"We handle the paperwork and procedures for licenses, quickly and hassle-free.",
wh:"Trust you can feel on the road",ws:"Seriousness, consistency and personal service in everything we do.",
st1:"Availability",st2:"Reliability",st3:"Single point of contact",st4:"Hidden fees",
ch:"Request your quote",cs:"Fill in the form and we will get back to you right away.",phs:"Call us any time",ems:"Write to us",
fs:"Service",fn:"Full name",fp:"Phone",fd:"Date",ft:"Time",fm:"Message / details",wa:"Viber",vb:"Message copied. Paste it into the Viber chat that opened.",send:"Send request",ok:"Thank you! Your request was sent and we will contact you soon.",fb:"Your email app has opened. Press Send so the request reaches us.",foot:"Taxi · Insurance · Paperwork"}};
let L="el";
const $=s=>document.querySelector(s);
function apply(){
 document.documentElement.lang=L;
 document.querySelectorAll("[data-i]").forEach(e=>{e.innerHTML=T[L][e.dataset.i]});
 $("#lang").textContent=L==="el"?"EN":"EL";
 $("#ms").placeholder=L==="el"?"Π.χ. προορισμός, τύπος οχήματος, ερώτηση…":"E.g. destination, vehicle type, question…";
}
$("#lang").onclick=()=>{L=L==="el"?"en":"el";apply()};
["#callTop","#callF","#phoneL"].forEach(s=>$(s).href="tel:"+CFG.phone);
$("#phoneT").textContent=CFG.phoneShow;$("#mailT").textContent=CFG.email;$("#mailL").href="mailto:"+CFG.email;
$("#yr").textContent=new Date().getFullYear();
function msg(){
 const g=id=>$(id).value.trim();
 return [`Geokali Taxi`,`${T[L].fs}: ${$("#svc").value}`,`${T[L].fn}: ${g("#nm")}`,`${T[L].fp}: ${g("#ph")}`,
 g("#dt")||g("#tm")?`${T[L].fd}: ${g("#dt")} ${g("#tm")}`:"",g("#ms")?`${T[L].fm}: ${g("#ms")}`:""].filter(Boolean).join("\n");
}
const subj=()=>"Geokali Taxi – "+$("#svc").value;
$("#wab").onclick=async()=>{if(!$("#f").reportValidity())return;
 try{await navigator.clipboard.writeText(msg());$("#st").textContent=T[L].vb}catch(_){}
 location.href="viber://chat?number="+encodeURIComponent(CFG.phone)};
$("#f").onsubmit=async e=>{
 e.preventDefault();
 const st=$("#st"),sb=$("#sb");sb.disabled=true;st.textContent="…";
 try{
  /* Automatic delivery to the owner's inbox (works when the page is hosted on the business's own domain) */
  const r=await fetch("https://formsubmit.co/ajax/"+CFG.email,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},
   body:JSON.stringify({_subject:subj(),_template:"table",Service:$("#svc").value,Name:$("#nm").value,Phone:$("#ph").value,Date:$("#dt").value,Time:$("#tm").value,Message:$("#ms").value})});
  if(!r.ok)throw 0;
  st.textContent=T[L].ok;$("#f").reset();
 }catch(_){
  /* Fallback: opens the customer's email app, addressed to the owner */
  location.href="mailto:"+CFG.email+"?subject="+encodeURIComponent(subj())+"&body="+encodeURIComponent(msg());
  st.textContent=T[L].fb;
 }
 sb.disabled=false;
};
apply();
</script>
</body>
</html>
